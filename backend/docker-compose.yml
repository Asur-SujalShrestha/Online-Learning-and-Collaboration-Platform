services:
  postgres:
    image: postgres:latest
    container_name: postgres_v1
    environment:
      POSTGRES_DB: CollApp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sujal
    volumes:
      - collapp-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  collApp:
    image: collapp-compose:v4
    build: .
    container_name: CollApp
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/CollApp
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  collapp-data:

networks:
  collapp-network:
    driver: bridge