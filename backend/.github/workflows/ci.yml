name: Java CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Grant permission to maven
        run: chmod +x backend/mvnw

      - name: Build and test
        working-directory: backend
        run: ./mvnw clean test

      - name: Build Docker image
        working-directory: backend
        run: docker build -t collapp:${{github.sha}}